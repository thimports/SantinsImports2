<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Termos de uso | Santins Imports</title>
<meta name="description" content="Termos e condições de uso do site e das compras na Santins Imports." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Archivo, Helvetica, sans-serif; color: #090909; background: #fff; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  img { display: block; max-width: 100%; }
  button { font-family: inherit; cursor: pointer; border: 0; }
  a { color: #090909; text-decoration: none; }
  a:hover { color: #E30613; }
  ::selection { background: #E30613; color: #fff; }
  html { -webkit-text-size-adjust: 100%; }
  body { max-width: 100vw; }
  img, video { max-width: 100%; }
  h1, h2, h3, p, span, strong, a, li, button { overflow-wrap: anywhere; }
  @media (max-width: 640px) {
    input, select, textarea { font-size: 16px; }
  }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</helmet>

<dc-import name="Header" hint-size="100%,150px"></dc-import>

<main style="width:100%;overflow-x:hidden;">
  <section style="border-bottom:1px solid #EDEDED;">
    <div style="max-width:900px;margin:0 auto;padding:clamp(36px,4.5vw,68px) 20px;">
      <p style="margin:0;font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8A8A;letter-spacing:.06em;"><a href="index.html" style="color:#8A8A8A;">Início</a> / <span style="color:#090909;">Termos de uso</span></p>
      <h1 style="margin:20px 0 0;font-size:clamp(30px,4.4vw,50px);line-height:1.03;font-weight:900;letter-spacing:-.04em;">Termos de uso</h1>
      <p style="margin:16px 0 0;font-size:16px;color:#6B6B6B;line-height:1.7;max-width:60ch;">Última atualização: [inserir data]. Ao navegar e comprar neste site, o cliente concorda com as condições abaixo.</p>
    </div>
  </section>

  <section style="max-width:900px;margin:0 auto;padding:clamp(40px,5vw,80px) 20px;">
    <sc-for list="{{ blocos }}" as="b" hint-placeholder-count="8">
      <div style="border-top:1px solid #E9E9E9;padding:28px 0;">
        <div style="display:flex;gap:16px;align-items:baseline;">
          <span style="flex:0 0 auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:#E30613;letter-spacing:.16em;">{{ b.n }}</span>
          <div style="min-width:0;">
            <h2 style="margin:0 0 12px;font-size:20px;font-weight:900;letter-spacing:-.01em;">{{ b.t }}</h2>
            <p style="margin:0;font-size:15px;line-height:1.75;color:#4A4A4A;max-width:64ch;text-wrap:pretty;">{{ b.p }}</p>
          </div>
        </div>
      </div>
    </sc-for>
    <p style="margin:32px 0 0;font-family:'JetBrains Mono',monospace;font-size:10px;color:#A0A0A0;letter-spacing:.06em;">DOCUMENTO ESTRUTURADO PARA REVISÃO JURÍDICA ANTES DA PUBLICAÇÃO.</p>
  </section>
</main>

<dc-import name="Footer" hint-size="100%,560px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      blocos: [
        { n: '01', t: 'Sobre a loja', p: 'Santins Imports · CNPJ 60.981.896/0001-69 · Razão social Santins Imports · Endereço [editável]. Loja online de sneakers e streetwear em operação desde 2022.' },
        { n: '02', t: 'Cadastro e conta', p: '[Descreva as regras de cadastro: veracidade das informações, idade mínima, responsabilidade pela senha e possibilidade de cancelamento da conta.]' },
        { n: '03', t: 'Produtos e disponibilidade', p: 'As imagens são reais dos produtos comercializados. Pequenas variações de tonalidade podem ocorrer conforme a tela do dispositivo. [Descreva a política de estoque e o que acontece quando um item fica indisponível após o pedido.]' },
        { n: '04', t: 'Preços e pagamento', p: 'Os preços são exibidos em reais e podem ser alterados sem aviso prévio. [Informe as formas de pagamento aceitas, condições de parcelamento e o desconto aplicado no PIX.]' },
        { n: '05', t: 'Confirmação do pedido', p: '[Explique quando o pedido é considerado confirmado, o papel da aprovação do pagamento e como o cliente é notificado.]' },
        { n: '06', t: 'Prazos e entrega', p: 'As condições de envio estão descritas na página de trocas e devoluções, na seção de política de entrega. [Informe prazos de separação e envio.]' },
        { n: '07', t: 'Trocas, devoluções e arrependimento', p: 'As condições estão descritas na página de trocas e devoluções, respeitando o direito de arrependimento previsto no Código de Defesa do Consumidor.' },
        { n: '08', t: 'Propriedade intelectual e foro', p: '[Descreva a titularidade das marcas, textos e imagens do site, o uso permitido do conteúdo e o foro eleito para resolução de conflitos.]' }
      ]
    };
  }
}
</script>
</body>
</html>
